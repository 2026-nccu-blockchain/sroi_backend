<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社會影響力評估平台註冊驗證碼</title>
  </head>
  <body style="margin:0;background:#f5f1f7;color:#241b29;font-family:Arial,'Noto Sans TC',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f1f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e3d9e8;">
            <tr>
              <td style="padding:24px 32px;background:#765292;color:#ffffff;">
                <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:2px;">SROI</p>
                <h1 style="margin:10px 0 0;font-size:24px;line-height:1.4;">註冊驗證碼</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 18px;font-size:15px;line-height:1.8;color:#554b5a;">
                  請複製下方驗證碼，回到註冊頁面填入以完成 Email 驗證。
                </p>
                <p style="margin:28px 0;padding:18px;background:#f7f3f9;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;font-family:'Courier New',monospace;">
                  $code
                </p>
                <p style="margin:0;font-size:13px;line-height:1.7;color:#756b79;">
                  驗證碼將在 $expire_minutes 分鐘後失效，請勿將驗證碼提供給他人。
                </p>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.7;color:#8a808e;">
                  如果你沒有申請註冊社會影響力評估平台，可以忽略此信件。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;border-top:1px solid #eee6f1;color:#8a808e;font-size:11px;line-height:1.6;">
                此信件由社會影響力評估平台系統自動寄出，請勿直接回覆。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
