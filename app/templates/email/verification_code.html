<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light only">
    <title>社會影響力評估平台註冊驗證碼</title>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;color:#000000;font-family:Arial,Helvetica,'Noto Sans TC',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ffffff;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;border:1px solid #000000;background:#ffffff;">
            <tr>
              <td style="padding:32px 32px 0;">
                <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:0.14em;">SROI</p>
                <h1 style="margin:6px 0 0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-0.04em;">註冊驗證碼</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px;">
                <p style="margin:0 0 20px;font-size:14px;line-height:1.7;color:#000000;">
                  請複製下方驗證碼，回到註冊頁面填入以完成 Email 驗證。
                </p>

                <!-- 信件不能執行 JavaScript，用 user-select:all 讓點一下就選取整組驗證碼 -->
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" style="padding:20px 12px;border:1px solid #000000;">
                      <span style="-webkit-user-select:all;user-select:all;font-family:'Courier New',Courier,monospace;font-size:32px;font-weight:700;letter-spacing:0.3em;color:#000000;">$code</span>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:10px 12px;background:#000000;color:#ffffff;font-size:13px;font-weight:700;letter-spacing:0.08em;">
                      點一下驗證碼即可全選，再複製貼上
                    </td>
                  </tr>
                </table>

                <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#5f5f5f;">
                  驗證碼將在 <strong style="color:#000000;">$expire_minutes 分鐘</strong>後失效，請勿將驗證碼提供給他人。
                </p>
                <p style="margin:8px 0 0;font-size:13px;line-height:1.7;color:#5f5f5f;">
                  如果你沒有申請註冊社會影響力評估平台，可以忽略此信件。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 32px;border-top:1px solid #000000;font-size:11px;line-height:1.6;color:#5f5f5f;">
                此信件由社會影響力評估平台系統自動寄出，請勿直接回覆。
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
