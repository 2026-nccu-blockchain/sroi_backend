<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light only">
    <title>社會影響力評估平台帳號邀請</title>
  </head>
  <body style="margin:0;padding:0;background:#ffffff;color:#000000;font-family:Arial,Helvetica,'Noto Sans TC',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#ffffff;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;border:1px solid #000000;background:#ffffff;">
            <tr>
              <td style="padding:32px 32px 0;">
                <p style="margin:0;font-size:12px;font-weight:700;letter-spacing:0.14em;">SROI</p>
                <h1 style="margin:6px 0 0;font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-0.04em;">帳號邀請</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px;">
                <p style="margin:0 0 16px;font-size:14px;line-height:1.7;color:#000000;">
                  管理員邀請你使用社會影響力評估平台。請點下方按鈕，設定姓名與密碼後即可開始使用。
                </p>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:0 0 20px;font-size:14px;line-height:1.7;">
                  <tr>
                    <td style="padding:6px 0;width:88px;color:#5f5f5f;">帳號</td>
                    <td style="padding:6px 0;font-weight:700;word-break:break-all;">$email</td>
                  </tr>
                  <tr>
                    <td style="padding:6px 0;color:#5f5f5f;">所屬單位</td>
                    <td style="padding:6px 0;font-weight:700;">$organization</td>
                  </tr>
                  <tr>
                    <td style="padding:6px 0;color:#5f5f5f;">使用期限</td>
                    <td style="padding:6px 0;font-weight:700;">完成設定後 $valid_years 年</td>
                  </tr>
                </table>

                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="background:#000000;">
                      <a href="$link" style="display:inline-block;padding:14px 28px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;">設定密碼</a>
                    </td>
                  </tr>
                </table>

                <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#5f5f5f;">
                  按鈕無法點選時，請複製下方網址貼到瀏覽器：
                </p>
                <p style="margin:4px 0 0;font-size:12px;line-height:1.6;word-break:break-all;color:#000000;">$link</p>
                <p style="margin:16px 0 0;font-size:13px;line-height:1.7;color:#5f5f5f;">
                  連結將在 <strong style="color:#000000;">$expires_text</strong> 失效，失效後請聯絡管理員重新寄送。如果你不認識此平台，可以忽略此信件。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 32px;border-top:1px solid #000000;font-size:11px;line-height:1.6;color:#5f5f5f;">
                此信件由社會影響力評估平台系統自動寄出，請勿直接回覆。<br>
                &copy; $copyright_year 社會影響力評估平台. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
